name: Security Watch

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  watch:
    name: CipherAI Security Watch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The watch state (.cipher-ai/watch-state.json) records what was found in
      # the previous scan. Fresh checkouts would reset the baseline every night,
      # so persist it across runs with the actions/cache.
      # actions/cache never overwrites an existing key, so the key MUST change
      # every run (run_id) while restore-keys falls back to the most recent
      # previous run — otherwise the baseline would be pinned to run #1 forever.
      - name: Cache watch state
        uses: actions/cache@v4
        with:
          path: .cipher-ai/watch-state.json
          key: cipherai-watch-${{ github.run_id }}
          restore-keys: |
            cipherai-watch-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build cipher-ai
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      # Keep the intentionally vulnerable accuracy corpus out of the general
      # product-source policy gate, matching the PR review scan boundary.
      - name: Exclude accuracy benchmark corpus from general review
        run: rm -rf benchmarks/accuracy

      # Publish a complete default-branch snapshot under a category separate
      # from pull-request analysis. Empty results remain valid and clear alerts.
      - name: Generate SARIF
        run: |
          mkdir -p .cipher-ai-results
          ./target/x86_64-unknown-linux-gnu/release/cipher-ai review \
            --format sarif \
            --output .cipher-ai-results/security-watch.sarif \
            --max-findings 0 \
            --fail-on-policy \
            --path .

      - name: Retain SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipher-ai-security-watch-sarif-${{ github.run_id }}
          path: .cipher-ai-results/security-watch.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .cipher-ai-results/security-watch.sarif
          category: cipher-ai/security-watch
          wait-for-processing: true

      - name: Run security watch (auto-fix PR)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: ./target/x86_64-unknown-linux-gnu/release/cipher-ai watch --once --risk high --pr --path .
