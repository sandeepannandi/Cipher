name: Issue triage
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Log title
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "New issue ${{ github.event.issue.number }}"
          echo "Title: $ISSUE_TITLE"
