[package]
name = "cipher"
version = "0.1.0"
edition = "2021"
description = "Cipher — AI-powered security analysis for your codebase. Index, search, and ask security questions using Groq AI."

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
colored = "2"
indicatif = "0.17"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
regex-lite = "0.1"
regex = "1"
