# Cipher build configuration
#
# This project targets x86_64-pc-windows-gnu (MinGW) on Windows.
# On other platforms, the host target is used automatically.

[target.x86_64-pc-windows-gnu]
linker = "gcc"
ar = "ar"

# Optimizations for development builds
[profile.dev]
opt-level = 1
debug = true

# Release build optimizations
[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
