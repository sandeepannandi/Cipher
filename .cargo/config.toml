# Cipher build configuration
# Remove or comment out [build] target to let Rust use the default for each platform
# (e.g., x86_64-unknown-linux-gnu on Linux/WSL, x86_64-pc-windows-msvc on Windows with MSVC)
#
# For Windows without MSVC, use:
[build]
target = "x86_64-pc-windows-gnu"

[target.x86_64-pc-windows-gnu]
linker = "rust-lld"
